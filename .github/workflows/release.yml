name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish, for example v1.0.0
        required: true
        type: string
      prerelease:
        description: Mark GitHub release as a prerelease
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate branch
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "Releases must be created from main."
            exit 1
          fi

      - name: Validate version
        run: |
          VERSION="${{ inputs.version }}"

          if ! echo "$VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "Version must match vMAJOR.MINOR.PATCH, for example v1.0.0."
            exit 1
          fi

          if git rev-parse "$VERSION" >/dev/null 2>&1; then
            echo "Tag $VERSION already exists."
            exit 1
          fi

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: xdebug

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Validate composer
        run: composer validate --strict

      - name: Pint
        run: composer format:test

      - name: Rector
        run: composer rector:test

      - name: PHPStan
        run: composer analyse

      - name: Run tests
        run: composer test

      - name: Run coverage
        run: composer test:coverage

  publish:
    name: Publish release
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Create tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ inputs.version }}" -m "${{ inputs.version }}"
          git push origin "${{ inputs.version }}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ARGS=(
            "${{ inputs.version }}"
            --repo "${{ github.repository }}"
            --title "${{ inputs.version }}"
            --generate-notes
          )

          if [ "${{ inputs.prerelease }}" = "true" ]; then
            ARGS+=(--prerelease)
          fi

          gh release create "${ARGS[@]}"
